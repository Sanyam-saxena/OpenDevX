name: Production CD & Image Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/opendevx-api:latest
            ghcr.io/${{ env.REPO_OWNER }}/opendevx-api:${{ github.sha }}

      - name: Build and Push Frontend Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/opendevx-web:latest
            ghcr.io/${{ env.REPO_OWNER }}/opendevx-web:${{ github.sha }}

  helm-lint-and-validate:
    name: Lint & Template Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Helm Lint
        run: |
          helm lint infrastructure/kubernetes/helm/opendevx

      - name: Helm Template Validation
        run: |
          helm template opendevx-test infrastructure/kubernetes/helm/opendevx
