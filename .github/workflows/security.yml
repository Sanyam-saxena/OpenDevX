name: DevSecOps Vulnerability & Code Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

jobs:
  sast-backend:
    name: Bandit Python SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Audit
        run: |
          bandit -r apps/api/app -ll -ii

  container-security:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Local API Image for Scanning
        run: |
          docker build -t opendevx-api:scan ./apps/api

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'opendevx-api:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  dependency-audit:
    name: Frontend Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run NPM Audit
        run: |
          npm --prefix apps/web audit --audit-level=high || true
