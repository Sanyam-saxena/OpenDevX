# =============================================================================
# OpenDevX — Prometheus Monitoring Scrape Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # OpenDevX FastAPI Backend Exporter
  - job_name: "opendevx-api"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "backend"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Redis Cache Exporter
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
        labels:
          service: "cache"
