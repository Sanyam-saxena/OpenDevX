apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opendevx.fullname" . }}-config
  labels:
    app.kubernetes.io/name: opendevx
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  APP_NAME: {{ .Values.api.env.APP_NAME | quote }}
  APP_ENV: {{ .Values.api.env.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.api.env.LOG_LEVEL | quote }}
  CORS_ORIGINS: {{ .Values.api.env.CORS_ORIGINS | quote }}
