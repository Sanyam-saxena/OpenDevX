apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opendevx.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: opendevx
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.api.secrets.SECRET_KEY | quote }}
  DATABASE_URL: {{ .Values.api.secrets.DATABASE_URL | quote }}
