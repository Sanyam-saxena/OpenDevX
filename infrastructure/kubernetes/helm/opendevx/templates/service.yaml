apiVersion: v1
kind: Service
metadata:
  name: {{ include "opendevx.fullname" . }}-api
  labels:
    app.kubernetes.io/name: opendevx-api
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: opendevx-api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opendevx.fullname" . }}-web
  labels:
    app.kubernetes.io/name: opendevx-web
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: opendevx-web
