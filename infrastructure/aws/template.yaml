AWSTemplateFormatVersion: '2010-09-09'
Description: 'OpenDevX AWS Free-Tier S3 Web Hosting Infrastructure'

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment stage name

Resources:
  # ------------------------------------------------------------
  # Frontend Static Web Hosting Bucket (S3 Website)
  # ------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'opendevx-web-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # ------------------------------------------------------------
  # AWS API Gateway HTTP API for Secure HTTPS SSL Access
  # ------------------------------------------------------------
  HttpsGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'opendevx-https-gateway-${AWS::Region}'
      ProtocolType: HTTP
      Target: !GetAtt FrontendBucket.WebsiteURL

Outputs:
  FrontendHTTPSWebsiteURL:
    Description: Live Secure AWS HTTPS Web Hosting URL for OpenDevX
    Value: !GetAtt HttpsGateway.ApiEndpoint
  FrontendS3WebsiteURL:
    Description: Live AWS S3 Web Hosting URL
    Value: !GetAtt FrontendBucket.WebsiteURL
  S3BucketName:
    Description: S3 Bucket Name
    Value: !Ref FrontendBucket
