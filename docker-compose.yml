# =============================================================================
# OpenDevX — Docker Compose (local development)
# =============================================================================
# Start the full stack:   docker compose up --build
# Stop and remove:        docker compose down
# Stop, remove volumes:   docker compose down -v
#
# All services communicate over the opendevx-network bridge network.
# Source code is bind-mounted so that hot reload works without rebuilds.
#
# NOTE: This file targets Docker Compose V2. The deprecated `version` field
# is intentionally omitted.
# =============================================================================

# ---------------------------------------------------------------------------
# Named volumes — persist data across container restarts.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ---------------------------------------------------------------------------
# Custom bridge network — all services join this network by default.
# ---------------------------------------------------------------------------
networks:
  opendevx-network:
    driver: bridge

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # -------------------------------------------------------------------------
  # database — PostgreSQL
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: opendevx-db
    restart: unless-stopped
    networks:
      - opendevx-network
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # cache — Redis
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: opendevx-redis
    restart: unless-stopped
    networks:
      - opendevx-network
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # api — FastAPI backend
  # -------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: opendevx-api
    restart: unless-stopped
    networks:
      - opendevx-network
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
    volumes:
      # Bind-mount source code for Uvicorn --reload hot reload.
      - ./apps/api:/app
      # Exclude the host .venv from the mount; use the container-installed packages.
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------------
  # web — React + Vite frontend
  # -------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: opendevx-web
    restart: unless-stopped
    networks:
      - opendevx-network
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      # Enable polling-based file watching for reliable HMR on bind mounts
      # (required on Docker Desktop for Mac/Windows).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Bind-mount source code for Vite HMR.
      - ./apps/web:/app
      # Preserve the container-installed node_modules; do not overlay with host.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
